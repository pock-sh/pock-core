[package]
name = "pock-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pock zero-knowledge crypto core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x-wing = { version = "0.1.0-rc.0", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "getrandom/js"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
