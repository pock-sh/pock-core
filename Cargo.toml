[package]
name = "pock-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pock zero-knowledge crypto core"

[lib]
name = "pock_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
sha2 = "0.10"
hkdf = "0.12"
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x-wing = { version = "0.1.0-rc.0", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wasm-bindgen = { version = "0.2", optional = true }
uniffi = { version = "0.32", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "getrandom/js"]
# `uniffi` and `wasm` are orthogonal and must never be enabled together
# (no `--all-features` on this crate).
uniffi = ["dep:uniffi"]
# Only needed to run the bindings generator binary; pulls in uniffi's CLI deps.
uniffi-cli = ["uniffi", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

# On wasm32 the dependency tree pulls a SECOND getrandom major version (0.4, via
# x-wing -> rand_core 0.10). That line removed the `js` feature; it needs the
# `wasm_js` feature here PLUS the `--cfg getrandom_backend="wasm_js"` rustflag
# set in .cargo/config.toml. Cargo unifies features across the same version, so
# enabling wasm_js on this renamed alias also applies to x-wing's getrandom 0.4.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
