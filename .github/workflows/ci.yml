name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --features uniffi
      # `wasm` and `uniffi` are orthogonal and must never be enabled together,
      # so there is no `--all-features` pass: each feature is linted against the
      # target it actually ships to.
      - run: cargo clippy --features uniffi --all-targets -- -D warnings
      - run: cargo clippy --features wasm --target wasm32-unknown-unknown -- -D warnings
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-pack passes everything after `--` to cargo; the flags cannot be
      # interleaved or cargo is handed wasm-pack's own options.
      - run: wasm-pack test --node -- --features wasm
      - run: ./scripts/pack-wasm.sh

  xcframework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # macos-15 ships Xcode_16.3.app, but without its iOS platform installed:
      # under it every iOS Simulator destination is ineligible ("iOS 18.4 is
      # not installed"). The image default is the one with the runtimes, so we
      # stay on it and just record which version ran.
      - name: Record the Xcode in use
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version
      - run: ./scripts/build-xcframework.sh
      - name: Run the XCTest suite on a simulator
        run: |
          set -o pipefail
          # Pick by UDID: several runtimes expose the same device *name*, so a
          # name-based destination is ambiguous on a runner.
          PICK=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [d for devs in runtimes.values() for d in devs
                    if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not phones:
              sys.exit("no iPhone simulator available on this runner")
          best = next((d for d in phones if d["name"] == "iPhone 16"), phones[0])
          print(best["udid"], best["name"])
          ')
          echo "testing on: $PICK"
          xcodebuild test -scheme PockCore \
            -destination "platform=iOS Simulator,id=${PICK%% *}" | tail -20
