name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag must not be able to ship a red commit, so the same gate ci.yml runs on
  # main runs again here and everything else hangs off it.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --features uniffi
      # `wasm` and `uniffi` are orthogonal and must never be enabled together,
      # so each feature is linted against the target it actually ships to.
      - run: cargo clippy --features uniffi --all-targets -- -D warnings
      - run: cargo clippy --features wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  wasm:
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: ./scripts/pack-wasm.sh
      # The npm tarball ships as a plain release asset, so it needs the same
      # published checksum the xcframework zip gets. `shasum` records the bare
      # filename, which is what `shasum -c` alongside the download expects.
      - name: Checksum the tarball
        run: |
          set -euo pipefail
          TGZ=$(ls *.tgz)
          shasum -a 256 "$TGZ" > "${TGZ}.sha256"
          shasum -a 256 -c "${TGZ}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          # Listed separately rather than as `*.tgz*` so a stray file can never
          # ride along, and so the two jobs' `.sha256` names stay distinct when
          # `merge-multiple` flattens both artifacts into `dist/`.
          path: |
            *.tgz
            *.tgz.sha256
          if-no-files-found: error

  xcframework:
    needs: [check]
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      # Same Xcode as ci.yml — the image default, so the released binary is the
      # one CI actually exercised.
      - name: Record the Xcode in use
        run: xcodebuild -version
      - run: ./scripts/build-xcframework.sh
      # Cheap proof the manifest still parses, against the local-path form that
      # is what sits in the tree here. (The ubuntu publish job has no Swift.)
      - name: Check the package manifest parses
        run: swift package dump-package >/dev/null
      # `-y` keeps the symlinks inside the framework intact; the checksum is the
      # plain sha256 of the zip, which is exactly what SwiftPM verifies.
      - run: |
          zip -r -y PockCoreFFI.xcframework.zip PockCoreFFI.xcframework
          shasum -a 256 PockCoreFFI.xcframework.zip > PockCoreFFI.xcframework.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: "PockCoreFFI.xcframework.zip*"
          if-no-files-found: error
      # The generated Swift wrapper is gitignored on main (it is a build output),
      # but the release commit has to carry it or SwiftPM resolves the tag to an
      # empty `PockCore` target.
      - uses: actions/upload-artifact@v4
        with:
          name: swift-bindings
          path: swift/Sources/PockCore/*.swift
          if-no-files-found: error

  publish:
    needs: [wasm, xcframework]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release branch push and the tag re-point both need
          # real refs, not a shallow graft.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # SwiftPM resolves the tag, so the tag has to end up on a commit whose
      # Package.swift points at the uploaded zip AND whose tree contains the
      # generated bindings. Build that commit first, move the tag onto it, and
      # only then cut the release — so the release's target commit and its
      # generated notes describe the commit consumers actually get.
      - name: Pin the release commit and move the tag onto it
        run: |
          set -euo pipefail
          SUM=$(cut -d' ' -f1 dist/PockCoreFFI.xcframework.zip.sha256)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/PockCoreFFI.xcframework.zip"
          # Anchored to the binaryTarget line, so nothing else in the manifest
          # (notably `// swift-tools-version:5.9`) can be rewritten. Matching
          # the whole tail rather than the literal `path:` form also makes a
          # re-run against an already-pinned tag idempotent.
          sed -i "s|^\( *\)\.binaryTarget(name: \"PockCoreFFI\",.*|\1.binaryTarget(name: \"PockCoreFFI\", url: \"${URL}\", checksum: \"${SUM}\"),|" Package.swift
          grep -q "^// swift-tools-version:5.9\$" Package.swift
          grep -q "checksum: \"${SUM}\"" Package.swift
          mkdir -p swift/Sources/PockCore
          cp dist/*.swift swift/Sources/PockCore/
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -B "release/${GITHUB_REF_NAME}"
          git add Package.swift
          # `-f`: these stay gitignored on main; only release commits carry them.
          git add -f swift/Sources/PockCore/*.swift
          if git diff --cached --quiet; then
            echo "tag already points at a pinned commit; nothing to rewrite"
          else
            git commit -m "release: pin Package.swift and bindings to ${GITHUB_REF_NAME}"
            git push -f origin "release/${GITHUB_REF_NAME}"
            git tag -f "${GITHUB_REF_NAME}"
            git push -f origin "${GITHUB_REF_NAME}"
          fi
      - name: Publish the release
        run: |
          set -euo pipefail
          ASSETS=(
            dist/*.tgz
            dist/*.tgz.sha256
            dist/PockCoreFFI.xcframework.zip
            dist/PockCoreFFI.xcframework.zip.sha256
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${ASSETS[@]}"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
